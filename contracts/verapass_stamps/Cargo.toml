[package]
name = "verapass_stamps"
version = "0.1.0"
description = "Verapass proof-of-presence stamps: creator and place registry plus non-transferable visit stamps"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
